 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkCavControl | Registro de usuarios</title>

  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
  >

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <nav class="blue darken-3">
      <div class="nav-wrapper container">
        <a href="index.html" class="brand-logo">
          <i class="material-icons left">local_parking</i>
          ParkCavControl
        </a>

        <ul class="right hide-on-med-and-down">
          <li><a href="index.html">Inicio</a></li>
          <li class="active"><a href="registro.html">Registro</a></li>
          <li><a href="informacion.html">Información</a></li>
          <li><a href="login.html">Iniciar sesión</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="section grey lighten-4 page-min-height">
    <div class="container">
      <div class="row">
        <div class="col s12 center-align">
          <h1 class="blue-text text-darken-3">Registro de usuarios</h1>
          <p class="flow-text grey-text text-darken-1">
            Complete los datos para registrar un usuario en ParkCavControl.
          </p>
        </div>
      </div>

      <div class="row">
        <div class="col s12 m10 offset-m1 l8 offset-l2">
          <div class="card z-depth-3">
            <div class="card-content">
              <span class="card-title blue-text text-darken-3">
                Datos del usuario
              </span>

              <form id="registroForm">
                <div class="row">
                  <div class="input-field col s12 m6">
                    <input id="nombres" type="text" required>
                    <label for="nombres">Nombres</label>
                  </div>

                  <div class="input-field col s12 m6">
                    <input id="apellidos" type="text" required>
                    <label for="apellidos">Apellidos</label>
                  </div>
                </div>

                <div class="row">
                  <div class="input-field col s12 m6">
                    <input id="documento" type="text" required>
                    <label for="documento">Número de documento</label>
                  </div>

                  <div class="input-field col s12 m6">
                    <input id="correo" type="email" required>
                    <label for="correo">Correo electrónico</label>
                  </div>
                </div>

                <div class="row">
                  <div class="input-field col s12 m6">
                    <input id="telefono" type="tel" required>
                    <label for="telefono">Teléfono</label>
                  </div>

                  <div class="input-field col s12 m6">
                    <input id="placa" type="text" required>
                    <label for="placa">Placa del vehículo</label>
                  </div>
                </div>

                <div class="row">
                  <div class="input-field col s12">
                    <select id="tipoUsuario" required>
                      <option value="" disabled selected>Seleccione una opción</option>
                      <option value="residente">Residente</option>
                      <option value="visitante">Visitante</option>
                      <option value="administrador">Administrador</option>
                    </select>

                    <label for="tipoUsuario">Tipo de usuario</label>
                  </div>
                </div>

                <div class="row">
                  <div class="input-field col s12">
                    <textarea id="direccion" class="materialize-textarea"></textarea>
                    <label for="direccion">Dirección</label>
                  </div>
                </div>

                <p>
                  <label>
                    <input type="checkbox" required>
                    <span>Autorizo el tratamiento de mis datos personales.</span>
                  </label>
                </p>

                <div class="center-align form-buttons">
                  <button
                    class="btn-large blue darken-3 waves-effect waves-light"
                    type="submit"
                  >
                    Registrar usuario
                    <i class="material-icons right">save</i>
                  </button>

                  <a href="index.html" class="btn-large grey waves-effect waves-light">
                    Cancelar
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="page-footer blue darken-3">
    <div class="footer-copyright blue darken-4">
      <div class="container">
        © 2026 ParkCavControl — Registro de usuarios
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="css/js/app.js"></script>
</body>
</html>
